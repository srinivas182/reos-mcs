      captions become searchable passages. Off: the original file plays from S3.

  - id: synthesia
    name: Synthesia (AI avatar lessons)
    kind: platform_service
    category: ai
    purpose: Render AI avatar lesson videos from approved scripts, in English and Spanish.
    launch: not_applicable
    build: { sprint: 7, item: A7.3 }
    owner: client
    access:
      route: contract
      lead_time_weeks: 3
      needed_by_sprint: 7
      status: not_started
    sandbox: Trial workspace; the API needs a plan with API access (test videos are watermarked and free).
    credentials: platform
    connection:
      auth: api_key
      accounts: platform
      fields:
        - { key: api_key, secret: true }
        - { key: stock_avatar }
        - { key: background, default: off_white }
    personal_data: true
    cost: Plan with API access (Creator or Enterprise).
    notes: >-
      A7.3 renders each lesson twice (English and Spanish, decision of 23 November 2026) with POST /v2/videos
      and polls GET /v2/videos/{id} every two minutes (reos:lessons:renders) until it's complete, then copies the
      download into REOS's storage and video pipeline, then deletes Synthesia's copy (DELETE /v2/videos/{id}). Test keys
      make free, watermarked test videos. Spanish uses scriptLanguage es-MX. Confirm the request and response fields
      against the sandbox before switching to Live. An instructor's own avatar is made in Synthesia's
      studio from the consented sample and its id recorded on screen 52; it is never used without consent in force.
    fallback: HeyGen; human-recorded video if TREC approval of avatar courses is delayed.

