  # ── Notifications and messaging ─────────────────────────────────────────────
  - id: expo-push
    name: Expo push notifications (APNs, FCM)
    kind: platform_service
    category: notifications
    purpose: Push notifications to the iOS and Android apps.
    launch: not_applicable
    build: { sprint: 6, item: B6.2 }
    owner: mayura
    access:
      route: self_serve
      lead_time_weeks: 1
      needed_by_sprint: 6
      status: not_started
    sandbox: Development builds.
    credentials: platform
    connection:
      auth: api_key
      accounts: platform
      fields:
        - { key: access_token, secret: true, required: false }
    personal_data: false
    cost: Included with Expo.
    notes: >-
      B6.2b sends through it (PushChannel; receipts checked by reos:push:receipts). Needs the EAS
      project id in the app config and the Apple push key and Firebase project from the store
      accounts; until set up, production sends no push and the simulator keeps an outbox elsewhere.
      The access token is only needed if push security is turned on in Expo.

  - id: amazon-ses
    name: Amazon SES (email)
    kind: platform_service
    category: notifications
    purpose: Transactional email, digests and the morning brief.
    launch: not_applicable
    build: { sprint: 6, item: B6.2 }
    owner: client
    access:
      route: app_review
      lead_time_weeks: 1
      needed_by_sprint: 6
      status: not_started
    sandbox: SES sandbox (verified recipients only).
    credentials: platform
    connection:
      auth: aws
      accounts: platform
      fields:
        - { key: access_key_id }
        - { key: secret_access_key, secret: true }
        - { key: region, default: us-east-2 }
        - { key: from_email, kind: email, default: hello@reos.com }
        - { key: sns_topic_arn, required: false }
    personal_data: true
    cost: Per 1,000 emails.
    notes: >-
      Request production access; set up SPF, DKIM and DMARC on the product domain. B6.2d sends all
      mail through it when MAIL_MAILER=reos (keys resolved from here at send time; the log until set
      up) and reads bounces and complaints from an SNS topic subscribed to
      https://reos.com/webhooks/ses (SNS-signed; pin the topic ARN here). Hard bounces and
      complaints stop email to that address until the person resumes it.

