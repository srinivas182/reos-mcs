      and polls GET /v1/video_status.get every two minutes until completed. It then copies the video into REOS's storage
      and video pipeline and deletes HeyGen's copy (DELETE /v1/video.delete). HeyGen also has a newer v3 video API, so
      confirm the status and delete endpoints and their fields against the sandbox before switching to Live. An instructor's
      digital twin is made from the consented sample and its avatar id recorded on screen 52.
    fallback: Synthesia; human-recorded video.

