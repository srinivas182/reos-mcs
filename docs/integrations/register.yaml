  # ── CRM ─────────────────────────────────────────────────────────────────────
  - id: follow-up-boss
    name: Follow Up Boss
    kind: integration
    category: crm
    purpose: Two-way contacts, notes and tasks; newest change wins.
    launch: enabled
    build: { sprint: 7, item: B7.2 }
    owner: client_with_mayura
    access:
      route: partner_application
      lead_time_weeks: 4
      needed_by_sprint: 7
      apply_by: 2026-12-18 # sprint plan: file in sprint 1, approval times vary
      status: not_started
    sandbox: Free trial account; register a system key.
    credentials: tenant
    connection:
      auth: api_key
      accounts: user
      fields:
        - { key: system_name, default: REOS }
        - { key: system_key, secret: true }
    personal_data: true
    cost: Free API; agents use their own Follow Up Boss plan.
    notes: >-
      B7.2 (ADR 0028): agents connect with their own API key (Admin › API); every request also sends REOS's
      registered X-System and X-System-Key. REOS reads /me, /people, /notes and /tasks (sort=updated, updatedAfter,
      paged with next) and writes POST /notes, PUT /tasks/{id} (isCompleted) and PUT /people/{id} (stage). Webhooks
      (POST /webhooks per event, peopleCreated/Updated/Deleted, notesCreated/Updated, tasksCreated/Updated) are checked
      with FUB-Signature (HMAC-SHA256 of the base64 body with the system key) and only queue a sync; the 15-minute
      schedule is the backstop. Confirm list filters and webhook fields against the trial account before Live.
    fallback: CSV import; email forwarding.

  - id: boldtrail
    name: kvCORE / BoldTrail
    kind: integration
    category: crm
    purpose: Two-way contacts, notes and tasks.
    launch: enabled
    build: { sprint: 7, item: B7.3 }
    owner: client_with_mayura
    access:
      route: partner_application
      lead_time_weeks: 8
      needed_by_sprint: 7
      apply_by: 2026-12-18 # sprint plan: file in sprint 1, approval times vary
      status: not_started
    sandbox: A test account's API token (Lead Engine › Lead Dropbox) and Developer Portal access.
    credentials: tenant
    connection:
      auth: api_key
      accounts: user
      fields:
        - { key: server_url, default: "https://api.kvcore.com/v2/public" }
    personal_data: true
    cost: Partner terms on application.
    notes: >-
      B7.3 (ADR 0029): each agent connects with their own kvCORE API token (Bearer). REOS polls every 15 minutes (no
      webhooks): GET /contacts (paged, newest first), GET /contact/{id}/notes for contacts that changed, GET /tasks;
      writes PUT /contact/{id} (status), POST /contact/{id}/action/note and PUT /task/{id} (complete). Smart campaign
      status is read from the contact and shown, never changed. Confirm paths and fields against the V2 API when
      the test token arrives.
    fallback: CSV import.

  - id: lofty
    name: Lofty
    kind: integration
    category: crm
    purpose: Two-way leads, notes and tasks; stage and tags written back.
    launch: enabled
    build: { sprint: 8, item: B8.1 }
    owner: client_with_mayura
    access:
      route: self_serve
      lead_time_weeks: 0
      needed_by_sprint: 8
      status: not_started
    sandbox: A Lofty test account's API key (Settings › Integrations › API).
    credentials: tenant
    connection:
      auth: api_key
      accounts: user
      fields: []
    personal_data: true
    cost: Free API; agents use their own Lofty plan.
    notes: >-
      B8.1 (ADR 0033): each agent connects with their own Lofty API key, sent as Authorization: token ...; every
      request sends X-Error-Status: true. Base https://api.lofty.com. REOS reads GET /v1.0/leads (limit 100, offset;
      no changed-since filter, so a sync pages the leads and keeps those with lastUpdateTime after the last mark), then
      GET /v1.0/notes?leadId= and GET /v1.0/tasks?leadId= for changed leads. Writes POST /v1.0/notes (leadId, content,
      isPin), POST /v2.0/tasks/{id}/finish or /unfinish, and PUT /v1.0/leads/{id} (stage, tags). Webhooks: POST
      /v1.0/webhook for lists 2 (lead info), 9 (notes) and 10 (tasks), HTTPS callback with a per-connection signed
      address (Lofty doesn't sign deliveries); Lofty-Webhook-Id de-duplicates; deliveries only queue a sync, and the
      15-minute schedule is the backstop. Confirm webhook availability, the subscription id field and rate limits
      against the test account before Live.
    fallback: CSV import.

  - id: salesforce
    name: Salesforce
    kind: integration
    category: crm
    purpose: Contacts, leads, tasks and notes for brokerages on Salesforce; each agent sees the records they own.
    launch: enabled
    build: { sprint: 8, item: B8.2 }
    owner: mayura
    access:
      route: self_serve
      lead_time_weeks: 2
      needed_by_sprint: 8
      apply_by: 2026-12-18 # sprint plan: file in sprint 1, approval times vary
      status: not_started
    sandbox: Free Developer Edition org, with REOS's connected app installed.
    credentials: platform
    connection:
      auth: oauth2
      accounts: tenant
      fields:
        - { key: client_id }
        - { key: client_secret, secret: true }
        - { key: server_url, default: "https://login.salesforce.com" }
    personal_data: true
    cost: Free to connect; AppExchange listing (optional, later) needs a paid security review.
    notes: >-
      B8.2 (ADR 0033, decision 3): REOS's connected app (OAuth 2 web server flow with PKCE, scopes api and
      refresh_token; callback /integrations/salesforce/callback); server_url is the login address (test.salesforce.com for sandboxes).
      The brokerage connects its org once (Brokerage integrations, screen 40). REOS reads Contacts, Leads (not
      converted), Tasks with a WhoId and ContentNotes linked to a person through SOQL on SystemModstamp (notes on
      LastModifiedDate) every 15 minutes, plus /sobjects/{Contact|Lead}/deleted for removals; each record goes to the
      brokerage agent whose email is the record owner's, and records owned by anyone else are left out and counted.
      Writes a ContentNote plus a ContentDocumentLink, Task Status, and the stage field the brokerage mapped (Lead
      Status by default; a Contact field such as Stage__c only when chosen). Change Data Capture (paid editions) is
      later. API v62.0.
    fallback: CSV import.

