# REOS integrations register: the single source of truth for every
# integration, platform service, vendor account and outside approval REOS needs.
#
# Edit this file, then run `pnpm integrations:render` (the pre-commit hook does
# it for you). README.md in this folder is generated from it; CI fails if the two
# disagree or this file breaks the schema (register.schema.json).
#
# From Sprint 3 (B3.2) this file also seeds the back-office integration and
# payment-gateway catalogue, so the docs and the product can't disagree.
#
# Lead times are estimates for planning; replace them with the vendor's answer
# once an application is filed. Status values are updated by whoever owns the item.

version: 1
updated: 2026-11-21
# Decisions 20 Nov 2026: domain reos.com (working choice; Nelle may change it before launch);
# staging (2.1) and TestFlight/Play (2.3) move to just before the pilot.
sprint_one_starts: 2026-12-07 # sprints are 2 weeks; sprint N starts 14 × (N − 1) days later
pilot: 2027-09-14

entries:
  # ── Sign-in ─────────────────────────────────────────────────────────────────
  - id: google-sign-in
    name: Sign in with Google
    kind: platform_service
    category: identity
    purpose: One-tap sign-in with a Google account on the phone and the web.
    launch: not_applicable
    build: { sprint: 3, item: A3.1 }
    owner: client_with_mayura
    access:
      route: self_serve
      lead_time_weeks: 1
      needed_by_sprint: 3
      status: not_started
    sandbox: Any Google account; the OAuth consent screen stays in testing until launch. Only openid, email and profile scopes, so no Google verification is needed.
    credentials: platform
    connection:
      auth: oauth2
      accounts: user
      fields:
        - { key: client_id }
        - { key: client_secret, secret: true }
        - { key: ios_client_id, required: false }
    personal_data: true
    cost: Free.
    notes: >-
      Separate OAuth client from Google Calendar (google-calendar), so sign-in
      never waits for the restricted-scope verification. The phone app asks Google for an ID token
      for the web client ID; iOS also needs its own iOS client ID.

  - id: apple-sign-in
    name: Sign in with Apple
    kind: platform_service
    category: identity
    purpose: One-tap sign-in with an Apple ID on the phone and the web, with Hide My Email.
    launch: not_applicable
    build: { sprint: 3, item: A3.1 }
    owner: client
    access:
      route: self_serve
      lead_time_weeks: 0
      needed_by_sprint: 3
      status: not_started
    sandbox: Any Apple ID on a development build. Needs the Apple Developer account (apple-developer) first.
    credentials: platform
    connection:
      auth: oauth2
      accounts: user
      fields:
        - { key: client_id }
        - { key: team_id }
        - { key: key_id }
        - { key: private_key, secret: true, kind: multiline }
    personal_data: true
    cost: Free with the Apple Developer membership.
    notes: >-
      client_id is the Services ID used on the web; the phone app's bundle identifier is also
      accepted as an audience. App Store guideline 4.8 asks apps that offer Google sign-in to also
      offer a privacy-friendly login, which this meets.
    fallback: Android and the web launch with Google and phone sign-in; iOS waits for this entry.

  - id: twilio-verify
    name: Twilio Verify (phone sign-in codes)
    kind: platform_service
    category: identity
    purpose: Sends and checks the six-digit codes for phone sign-in and two-step checks, with fraud protection.
    launch: not_applicable
    build: { sprint: 3, item: A3.1 }
    owner: client
    access:
      route: self_serve
      lead_time_weeks: 1
      needed_by_sprint: 3
      status: not_started
    sandbox: Twilio test credentials; Verify sends to verified numbers on a trial account.
    credentials: platform
    connection:
      auth: api_key
      accounts: platform
      fields:
        - { key: account_sid }
        - { key: auth_token, secret: true }
        - { key: verify_service_sid }
    personal_data: true
    cost: Per successful verification plus the message fee; Fraud Guard included.
    notes: >-
      Verify uses Twilio's pre-registered senders, so phone sign-in doesn't wait for the 10DLC
      registration that twilio-sms needs. Decision 3 in the Sprint 3 spec.

  - id: cloudflare-saas
    name: Cloudflare for SaaS (tenant custom domains)
    kind: platform_service
    category: platform
    purpose: Tenants' own domains (learn.example.com) with automatic SSL, verified from Branding and domain or Brokerage settings.
    launch: not_applicable
    build: { sprint: 4, item: A4.2 }
    owner: client
    access:
      route: self_serve
      lead_time_weeks: 1
      needed_by_sprint: 4
      status: not_started
    sandbox: A staging zone with Cloudflare for SaaS enabled; 100 custom hostnames free.
    credentials: platform
    connection:
      auth: api_key
      accounts: platform
      fields:
        - { key: api_token, secret: true }
        - { key: zone_id }
        - { key: cname_target, default: tenants.reos.com }
    personal_data: false
    cost: 100 custom hostnames free on every plan, then $0.10 each per month (decision 2 in the Sprint 4 spec).
    fallback: Tenants use their <slug>.reos.com address.
    notes: >-
      The API token needs the SSL and Certificates edit permission on the reos.com zone. Runs on
      the Simulator until the account exists; the Simulator verifies a domain on the first check.
    sources:
      - https://developers.cloudflare.com/cloudflare-for-platforms/cloudflare-for-saas/plans/

  # ── Calendar, email and voice ───────────────────────────────────────────────
  - id: google-calendar
    name: Google Calendar
    kind: integration
    category: calendar_email
    purpose: >-
      Two-way calendar for every role. Appointments, showings, deadlines and to-do due dates made in REOS
      go to the calendar the person picks; changes in Google come back live.
    launch: enabled
    build: { sprint: 4, item: B4.1 }
    owner: client_with_mayura
    access:
      route: oauth_verification
      lead_time_weeks: 10
      needed_by_sprint: 4
      status: not_started
    sandbox: Test users on an unverified Google Cloud project (up to 100) until verification is approved.
    credentials: platform
    connection:
      auth: oauth2
      accounts: user
      fields:
        - { key: client_id }
        - { key: client_secret, secret: true }
    personal_data: true
    cost: Free API.
    notes: >-
      Calendar only (Sprint 4 decision 1): REOS doesn't read or send mail. Scopes are calendar.events
      (read and write events on the person's calendars) and calendar.calendarlist.readonly (the list of
      calendars to choose from). Both are sensitive scopes: Google's standard OAuth verification, with no
      security assessment. Push channels (events.watch) last about a week and are renewed a day before
      they end. The callback address is /integrations/google-calendar/callback.
    fallback: Scheduled sync every 15 minutes when push channels can't reach REOS; ICS calendar feed.
    sources:
      - https://developers.google.com/calendar/api/auth
      - https://developers.google.com/calendar/api/guides/push
      - https://developers.google.com/identity/protocols/oauth2/production-readiness/sensitive-scope-verification

  - id: outlook-calendar
    name: Outlook Calendar
    kind: integration
    category: calendar_email
    purpose: >-
      Two-way calendar for Microsoft 365 and Outlook.com. Appointments, showings, deadlines and to-do due dates
      made in REOS go to the calendar the person picks; changes in Outlook come back live.
    launch: enabled
    build: { sprint: 4, item: B4.2 }
    owner: client_with_mayura
    access:
      route: app_review
      lead_time_weeks: 3
      needed_by_sprint: 4
      status: not_started
    sandbox: Microsoft 365 Developer Program tenant, or a personal Outlook.com account.
    credentials: platform
    connection:
      auth: oauth2
      accounts: user
      fields:
        - { key: client_id }
        - { key: client_secret, secret: true }
    personal_data: true
    cost: Free API.
    notes: >-
      Calendar only (Sprint 4 decision 1): Outlook mail is not read or sent. Microsoft Entra multi-tenant app
      (the "common" endpoint, so work and personal accounts both sign in) with publisher verification (needs a
      Microsoft Partner Network ID), so customers' admins see a verified publisher when consenting. Delegated
      scopes: Calendars.ReadWrite, User.Read and offline_access. Changes come by delta queries per calendar and
      change-notification subscriptions (up to 7 days, renewed a day early, with lifecycle notifications). Outlook
      emails guests whenever an event lists them, so REOS adds guests only when the person asks for invitations.
      The callback address is /integrations/outlook-calendar/callback.
    fallback: Scheduled sync every 15 minutes when change notifications can't reach REOS.
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/publisher-verification-overview
      - https://learn.microsoft.com/en-us/graph/delta-query-events
      - https://learn.microsoft.com/en-us/graph/change-notifications-delivery-webhooks
      - https://learn.microsoft.com/en-us/graph/api/resources/subscription

