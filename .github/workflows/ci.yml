# REOS CI. See docs/ci.md for the rules this file implements.
#
# - Draft PRs run only the quick checks (style, lint, static analysis, types).
# - The full suite (tests and builds) runs when the PR is ready for review,
#   and on every later push to a ready PR.
# - Only the parts touched by the change run: docs-only changes run nothing.
# - Nothing runs again on main after merging; superseded runs are cancelled.
# - Every job has a 12-minute ceiling so a stuck runner can't burn minutes.
# - "CI result" is the single required check for branch protection.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PHP_VERSION: '8.5'
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      mobile: ${{ steps.filter.outputs.mobile }}
      devenv: ${{ steps.filter.outputs.devenv }}
      preview: ${{ steps.filter.outputs.preview }}
      repo-scripts: ${{ steps.filter.outputs.repo-scripts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            platform:
              - *shared
              - 'apps/platform/**'
            mobile:
              - *shared
              - 'apps/mobile/**'
            devenv:
              - 'compose.yaml'
              - 'docker/**'
              - '.devcontainer/**'
              - 'scripts/dev-*.sh'
              - 'scripts/devcontainer-setup.sh'
              - 'apps/platform/.env.example'
              - 'apps/platform/database/**'
              - 'apps/platform/config/filesystems.php'
              - 'apps/platform/config/database.php'
              - '.github/workflows/ci.yml'
            preview:
              - 'deploy/preview/**'
              - '.dockerignore'
            repo-scripts:
              - 'scripts/**'
              - 'docs/integrations/**'
              - 'packages/tokens/**'
              - 'packages/i18n/**'
              - 'packages/voice/**'
              - 'apps/platform/lang/**'
              - 'apps/platform/resources/integrations/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  platform-quick:
    name: Platform quick checks
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-platform
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: PHPStan result cache
        uses: actions/cache@v4
        with:
          path: apps/platform/storage/phpstan
          key: phpstan-${{ hashFiles('apps/platform/composer.lock', 'apps/platform/phpstan.neon') }}-${{ github.sha }}
          restore-keys: phpstan-${{ hashFiles('apps/platform/composer.lock', 'apps/platform/phpstan.neon') }}-

      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan (level 9)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form
      - name: Web lint and format
        run: pnpm check
      - name: Web types
        run: pnpm types:check
      - name: API contract is up to date
        # Scramble reads model columns from the database, so it gets a
        # throwaway SQLite one with the migrations applied. No Redis here, and
        # the roles migration clears the permission cache: use an in-memory one.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/scramble.sqlite
          CACHE_STORE: array
        run: |
          touch /tmp/scramble.sqlite
          php artisan migrate --force --no-interaction --quiet
          php artisan scramble:export
          pnpm --filter @reos/api-client generate
          if ! git diff --exit-code -- ../../packages/api-client; then
            echo "::error::The API changed but packages/api-client wasn't regenerated. Run 'pnpm api:generate' and commit the result."
            exit 1
          fi

  platform-tests:
    name: Platform tests
    needs: [changes, platform-quick]
    if: needs.changes.outputs.platform == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/platform
    # Tests run on the same database engine and cache as production.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: reos
          POSTGRES_PASSWORD: reos-ci
          POSTGRES_DB: reos_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reos" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: reos_testing
      # A normal user, so row-level security applies (ADR 0015); `reos` is the service's admin.
      DB_USERNAME: reos_app
      DB_PASSWORD: reos-app-ci
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - name: Database user without superuser or BYPASSRLS
        env:
          PGPASSWORD: reos-ci
        run: |
          psql -h 127.0.0.1 -U reos -d reos_testing -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE reos_app LOGIN PASSWORD 'reos-app-ci' CREATEDB NOSUPERUSER NOBYPASSRLS" \
            -c "ALTER DATABASE reos_testing OWNER TO reos_app" \
            -c "ALTER SCHEMA public OWNER TO reos_app" \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          # pgvector for the knowledge base (A5.3); parallel test databases copy template1.
          psql -h 127.0.0.1 -U reos -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      - uses: ./.github/actions/setup-platform
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Build web assets
        run: pnpm build
      - name: Migrations run forwards and backwards on PostgreSQL
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed
      - name: Tenant isolation is enforced by the database
        run: php artisan reos:tenancy:check
      - name: Pest (parallel, PostgreSQL)
        run: vendor/bin/pest --parallel
      - name: Playwright Chromium cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for story tests
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system libraries (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Web component and Storybook tests (Vitest, axe accessibility on every story)
        run: pnpm test

  mobile-quick:
    name: Mobile quick checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: pnpm check
      - name: Types
        run: pnpm types:check

  mobile-tests:
    name: Mobile tests
    needs: [changes, mobile-quick]
    if: needs.changes.outputs.mobile == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Jest
        run: pnpm test --ci

  dev-environment:
    name: Dev environment
    needs: changes
    if: needs.changes.outputs.devenv == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-platform
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Start services exactly as developers do
        run: bash scripts/dev-up.sh
      - name: Migrate and seed
        working-directory: apps/platform
        run: php artisan migrate --seed --force
      - name: Verify every service end to end
        run: bash scripts/dev-verify.sh
      - name: Dev container image builds with the PHP extensions we need
        run: |
          docker compose -f compose.yaml -f .devcontainer/compose.devcontainer.yaml build workspace
          docker compose -f compose.yaml -f .devcontainer/compose.devcontainer.yaml run --rm --no-deps workspace \
            sh -c 'php -v && php -m | grep -E "^(pdo_pgsql|redis|intl|bcmath)$" | wc -l | grep -qx 4'
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=80

  preview-image:
    # The preview environment for usability checks (P7.0, docs/preview.md).
    name: Preview image
    needs: changes
    if: needs.changes.outputs.preview == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid with the example settings
        working-directory: deploy/preview
        run: |
          sed 's/CHANGE-ME[^ ]*/ci-placeholder/' .env.example > .env
          docker compose config --quiet
      - name: Image builds
        run: docker build -f deploy/preview/Dockerfile -t reos-preview:ci .
      - name: Image runs the app with the PHP extensions we need
        run: |
          docker run --rm --entrypoint sh reos-preview:ci -c \
            'php -m | grep -E "^(pdo_pgsql|redis|intl|bcmath|pcntl|gd)$" | wc -l | grep -qx 6 && php artisan --version && test -f public/build/manifest.json'

  repo-scripts:
    # Cheap (no PHP), so it runs on drafts too.
    name: Repo scripts, tokens, translations and integrations register
    needs: changes
    if: needs.changes.outputs.repo-scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node
      - name: Integrations register is valid and README.md is current
        run: pnpm integrations:check
      - name: Script tests
        run: pnpm test:scripts
      - name: Design tokens (contrast, sizes, generated CSS current)
        run: pnpm --filter @reos/tokens test
      - name: Translations (Spanish complete, placeholders match, Laravel files current)
        run: pnpm --filter @reos/i18n test
      - name: Voice date parser (the phone's copy passes the shared phrase set)
        run: pnpm --filter @reos/voice test
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

  result:
    name: CI result
    if: always()
    needs: [changes, platform-quick, platform-tests, mobile-quick, mobile-tests, dev-environment, preview-image, repo-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarise
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Full run: $FULL_RUN"
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
